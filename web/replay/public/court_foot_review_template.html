<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Court / Foot Reference Desk</title>
  <style>
    :root{--ink:#e9eee8;--muted:#91a095;--panel:#111713;--deep:#070b08;--rule:#29372d;--lime:#b9f35b;--amber:#ffbf47;--red:#ff6b57;--blue:#68d8ff;--paper:#dbe7db}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#203126 0,transparent 35%),var(--deep);color:var(--ink);font-family:"IBM Plex Mono","Courier New",monospace;height:100vh;overflow:hidden}
    .shell{display:grid;grid-template-columns:minmax(0,1fr) 370px;grid-template-rows:66px 1fr;height:100vh}.top{grid-column:1/-1;display:flex;align-items:center;gap:22px;padding:0 22px;border-bottom:1px solid var(--rule);background:#0b100dcc}
    .brand{font:800 22px/1 Georgia,serif;letter-spacing:-.5px}.meter{height:8px;flex:1;background:#1e2821;border:1px solid #314037}.meter i{display:block;height:100%;background:var(--lime);width:0}.counter{color:var(--muted);font-size:12px}
    .stage{position:relative;min-width:0;display:grid;place-items:center;padding:18px;background-image:linear-gradient(#16201955 1px,transparent 1px),linear-gradient(90deg,#16201955 1px,transparent 1px);background-size:32px 32px}.canvasWrap{position:relative;max-width:100%;max-height:100%;box-shadow:0 24px 70px #000a;border:1px solid #4a5d4e}
    canvas{display:block;max-width:100%;max-height:calc(100vh - 103px);cursor:crosshair}.stamp{position:absolute;left:12px;top:12px;background:#071008d9;border-left:3px solid var(--lime);padding:7px 10px;font-size:11px;color:var(--paper)}
    aside{border-left:1px solid var(--rule);background:var(--panel);overflow:auto;padding:18px}.section{border-top:1px solid var(--rule);padding:16px 0}.section:first-child{border:0;padding-top:0}h2{font:700 12px/1.2 inherit;color:var(--amber);text-transform:uppercase;letter-spacing:1.6px;margin:0 0 10px}
    .hint{color:var(--muted);font-size:11px;line-height:1.55}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,.chip,select{border:1px solid #405044;background:#182019;color:var(--ink);font:700 11px/1 inherit;padding:9px 10px;cursor:pointer}.btn:hover,.chip:hover{border-color:var(--lime)}.btn.primary{background:var(--lime);color:#10150e;border-color:var(--lime)}.btn.warn{border-color:#674b2b;color:var(--amber)}.btn.active,.chip.active{outline:2px solid var(--amber);outline-offset:1px}
    .status{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.labels{display:grid;grid-template-columns:1fr 1fr;gap:5px}.chip{padding:7px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip.occluded{text-decoration:line-through;color:var(--red)}
    .player{border:1px solid var(--rule);margin:8px 0;padding:10px}.playerHead{display:flex;justify-content:space-between;color:var(--blue);font-weight:800;font-size:12px;margin-bottom:8px}kbd{border:1px solid #4a5c4d;padding:1px 4px;background:#202a22;color:var(--paper)}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top"><div class="brand">REFERENCE DESK / 01</div><div class="meter"><i id="meter"></i></div><div class="counter" id="counter"></div><button class="btn" id="export">EXPORT JSON</button></header>
    <main class="stage"><div class="canvasWrap"><canvas id="canvas"></canvas><div class="stamp" id="stamp"></div></div></main>
    <aside>
      <section class="section"><h2>Frame decision</h2><div class="status"><button class="btn primary" data-status="accepted">ACCEPT</button><button class="btn warn" data-status="needs_edit">EDIT</button><button class="btn" data-status="skipped">SKIP</button></div><p class="hint">Accept keeps untouched prelabels. Mark covered points occluded; never guess them.</p><div class="row"><button class="btn" id="prev">← PREV</button><button class="btn" id="next">NEXT →</button><button class="btn warn" id="occlude">TOGGLE OCCLUDED</button></div></section>
      <section class="section"><h2>Court points</h2><div class="labels" id="courtLabels"></div></section>
      <section class="section"><h2>Player feet</h2><div id="players"></div></section>
      <section class="section"><h2>Fast keys</h2><p class="hint"><kbd>A</kbd> accept · <kbd>S</kbd> skip · <kbd>J</kbd>/<kbd>K</kbd> move · select a marker then click its corrected pixel · <kbd>O</kbd> occluded · export often.</p></section>
    </aside>
  </div>
  <script>
    const packet=__PACKET_JSON__;
    const frames=packet.clips.flatMap(function(c){return c.frames.map(function(f){return Object.assign({},f,{clip_id:c.clip_id})})});
    const segments=[["near_left_corner","near_baseline_center"],["near_baseline_center","near_right_corner"],["near_left_corner","near_nvz_left"],["near_nvz_left","far_nvz_left"],["far_nvz_left","far_left_corner"],["near_right_corner","near_nvz_right"],["near_nvz_right","far_nvz_right"],["far_nvz_right","far_right_corner"],["near_nvz_left","near_nvz_center"],["near_nvz_center","near_nvz_right"],["far_nvz_left","far_nvz_center"],["far_nvz_center","far_nvz_right"],["far_left_corner","far_baseline_center"],["far_baseline_center","far_right_corner"],["near_baseline_center","near_nvz_center"],["far_nvz_center","far_baseline_center"]];
    const reviewNamespace=(packet.stabilization_review&&packet.stabilization_review.selection_version)||packet.foot_semantic_policy_version||"v1";
    const storageKey="courtFootReview:"+reviewNamespace+":"+packet.clips.map(function(c){return c.clip_id}).join("|");
    const initialReviewState=packet.initial_review_state||{frames:{}};
    let state=JSON.parse(localStorage.getItem(storageKey)||JSON.stringify(initialReviewState)),index=0,selected=null;
    const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d"),img=new Image();
    function frame(){return frames[index]}
    function review(){const id=frame().frame_id;return state.frames[id]||(state.frames[id]={court_points:{},players:{}})}
    function playerReview(id){const r=review();return r.players[id]||(r.players[id]={points:{}})}
    function save(){localStorage.setItem(storageKey,JSON.stringify(state));renderProgress()}
    function effective(group,name,base){const value=group&&group[name];if(value&&value.occluded)return null;if(value&&value.xy)return value.xy;return base}
    function setStatus(status){review().status=status;save();draw();buildSide()}
    document.querySelectorAll("[data-status]").forEach(function(button){button.onclick=function(){setStatus(button.dataset.status)}});
    function load(){selected=null;img.onload=function(){canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;draw();buildSide()};img.src=frame().image;document.getElementById("stamp").textContent=frame().clip_id+" / FRAME "+frame().frame_index;renderProgress()}
    function line(a,b,color,width){if(!a||!b)return;ctx.strokeStyle=color;ctx.lineWidth=width||3;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
    function dot(xy,color,label,key){if(!xy)return;ctx.fillStyle="#071008";ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(xy[0],xy[1],key===selected?10:7,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=color;ctx.font="bold 13px IBM Plex Mono,monospace";ctx.fillText(label,xy[0]+10,xy[1]-8)}
    function initials(name){return name.replaceAll("_"," ").replace(/\b\w/g,function(c){return c.toUpperCase()}).split(" ").map(function(x){return x[0]}).join("")}
    function draw(){ctx.drawImage(img,0,0);const f=frame(),r=review();segments.forEach(function(pair){line(effective(r.court_points,pair[0],f.automatic_court_points[pair[0]]),effective(r.court_points,pair[1],f.automatic_court_points[pair[1]]),"#b9f35b",3)});Object.entries(f.automatic_court_points).forEach(function(entry){dot(effective(r.court_points,entry[0],entry[1]),"#b9f35b",initials(entry[0]),"court:"+entry[0])});f.players.forEach(function(p,pi){const pr=playerReview(String(p.player_id)),colors=["#68d8ff","#ffbf47","#ff7dcb","#a58bff"],color=colors[pi%4];if(p.bbox_xyxy){ctx.strokeStyle=color+"88";ctx.lineWidth=2;ctx.strokeRect(p.bbox_xyxy[0],p.bbox_xyxy[1],p.bbox_xyxy[2]-p.bbox_xyxy[0],p.bbox_xyxy[3]-p.bbox_xyxy[1])}Object.entries(p.points).filter(function(entry){return entry[0]!=="bbox_bottom_center"}).forEach(function(entry){dot(effective(pr.points,entry[0],entry[1]),color,"P"+p.player_id+" "+initials(entry[0]),"player:"+p.player_id+":"+entry[0])})})}
    function chip(text,key,occluded){const button=document.createElement("button");button.className="chip"+(selected===key?" active":"")+(occluded?" occluded":"");button.textContent=text;button.onclick=function(){selected=key;draw();buildSide()};return button}
    function buildSide(){const f=frame(),r=review();document.querySelectorAll("[data-status]").forEach(function(button){button.classList.toggle("active",button.dataset.status===r.status)});const court=document.getElementById("courtLabels");court.innerHTML="";Object.keys(f.automatic_court_points).forEach(function(name){court.append(chip(name.replaceAll("_"," "),"court:"+name,r.court_points[name]&&r.court_points[name].occluded))});const box=document.getElementById("players");box.innerHTML="";f.players.forEach(function(p){const pr=playerReview(String(p.player_id)),el=document.createElement("div");el.className="player";el.innerHTML='<div class="playerHead"><span>PLAYER '+p.player_id+"</span><span>"+(p.side||"—")+" / "+(p.role||"—")+"</span></div><div class=\"hint\">PRELABEL: "+(p.prelabel_source||"unknown").replaceAll("_"," ")+"</div>";const labels=document.createElement("div");labels.className="labels";Object.keys(p.points).filter(function(name){return name!=="bbox_bottom_center"}).forEach(function(name){labels.append(chip(name.replaceAll("_"," "),"player:"+p.player_id+":"+name,pr.points[name]&&pr.points[name].occluded))});el.append(labels);const controls=document.createElement("div");controls.className="row";controls.style.marginTop="9px";controls.innerHTML='<select data-contact><option>uncertain</option><option>planted</option><option>airborne</option></select><button class="chip" data-foot="left">LEFT SUPPORT</button><button class="chip" data-foot="right">RIGHT SUPPORT</button>';const select=controls.querySelector("select");select.value=pr.contact_state||p.contact_state||"uncertain";select.onchange=function(){pr.contact_state=select.value;save()};controls.querySelectorAll("[data-foot]").forEach(function(button){button.classList.toggle("active",(pr.support_foot||p.support_foot)===button.dataset.foot);button.onclick=function(){pr.support_foot=button.dataset.foot;save();buildSide()}});el.append(controls);box.append(el)})}
    canvas.onclick=function(event){if(!selected)return;const rect=canvas.getBoundingClientRect(),xy=[(event.clientX-rect.left)*canvas.width/rect.width,(event.clientY-rect.top)*canvas.height/rect.height],parts=selected.split(":");if(parts[0]==="court")review().court_points[parts[1]]={xy:xy,occluded:false};else playerReview(parts[1]).points[parts[2]]={xy:xy,occluded:false};if(!review().status)review().status="needs_edit";save();draw();buildSide()}
    function toggleOccluded(){if(!selected)return;const parts=selected.split(":"),target=parts[0]==="court"?review().court_points:playerReview(parts[1]).points,name=parts[0]==="court"?parts[1]:parts[2],old=target[name]||{};target[name]=Object.assign({},old,{occluded:!old.occluded});if(!review().status)review().status="needs_edit";save();draw();buildSide()}
    function move(delta){index=Math.max(0,Math.min(frames.length-1,index+delta));load()}
    document.getElementById("prev").onclick=function(){move(-1)};document.getElementById("next").onclick=function(){move(1)};document.getElementById("occlude").onclick=toggleOccluded;
    function renderProgress(){const done=Object.values(state.frames).filter(function(x){return x.status}).length;document.getElementById("meter").style.width=(100*done/frames.length)+"%";document.getElementById("counter").textContent=(index+1)+"/"+frames.length+" · "+done+" DECIDED"}
    document.getElementById("export").onclick=function(){const output={artifact_type:"racketsport_court_foot_human_reference_review",schema_version:1,source_packet:{frame_count:packet.frame_count,clips:packet.clips.map(function(c){return c.clip_id})},exported_at:new Date().toISOString(),frames:state.frames},anchor=document.createElement("a");anchor.href=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)],{type:"application/json"}));anchor.download="court_foot_human_reference_review.json";anchor.click();URL.revokeObjectURL(anchor.href)}
    document.onkeydown=function(event){if(event.target.tagName==="SELECT")return;const key=event.key.toLowerCase();if(key==="a")setStatus("accepted");if(key==="s")setStatus("skipped");if(key==="j")move(-1);if(key==="k")move(1);if(key==="o")toggleOccluded()};load();
  </script>
</body>
</html>
